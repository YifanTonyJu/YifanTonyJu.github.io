<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Basketball — Hobbies</title>
  <style>
    * { margin: 0; padding: 0; }
    body { 
      display: flex; 
      align-items: center; 
      justify-content: center; 
      min-height: 100vh; 
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; 
      background: #f5f5f5; 
      padding: 20px; 
    }
    .container { 
      max-width: 1200px; 
      width: 100%; 
      display: flex; 
      gap: 20px; 
    }
    .videos-section { 
      flex: 1; 
      min-width: 0; 
    }
    .scores-section { 
      width: 400px; 
      max-height: 1200px;
      overflow-y: auto;
    }
    iframe { 
      width: 100%; 
      border-radius: 8px; 
    }
    iframe + iframe { 
      margin-top: 16px; 
    }

    /* NBA Scores Card */
    .view-schedule-btn {
      width: 100%;
      padding: 14px;
      margin-top: 16px;
      background: #f8f9fa;
      border: 1px solid #ddd;
      border-radius: 8px;
      color: #4285f4;
      font-size: 15px;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.2s;
    }
    .view-schedule-btn:hover {
      background: #f0f0f0;
    }
    .live-badge {
      background: #e8f5e9;
      color: #2e7d32;
      padding: 6px 12px;
      border-radius: 6px;
      font-size: 12px;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .live-dot {
      width: 8px;
      height: 8px;
      background: #2e7d32;
      border-radius: 50%;
      animation: pulse 2s infinite;
    }
    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.5; }
    }
    .date-info {
      display: flex;
      align-items: center;
      gap: 8px;
      color: #666;
      font-size: 14px;
      margin-bottom: 16px;
      padding-bottom: 16px;
      border-bottom: 1px solid #eee;
    }
    .game-item {
      display: flex;
      flex-direction: column;
      gap: 12px;
      padding: 16px 0;
      border-bottom: 1px solid #eee;
    }
    .game-item:last-of-type {
      border-bottom: none;
    }
    .teams-row {
      display: flex;
      gap: 12px;
      align-items: center;
    }
    .team-block {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
    }
    .team-name {
      font-size: 14px;
      font-weight: 500;
      color: #1a1a1a;
      text-align: center;
    }
    .team-code {
      font-size: 11px;
      color: #999;
    }
    .team-logo {
      width: 45px;
      height: 45px;
      object-fit: contain;
      margin-bottom: 6px;
    }
    .score-display {
      text-align: center;
      display: flex;
      flex-direction: column;
      gap: 4px;
      min-width: 80px;
    }
    .score-numbers {
      font-size: 18px;
      font-weight: 600;
      color: #1a1a1a;
      letter-spacing: 1px;
    }
    .game-status {
      font-size: 12px;
      color: #4285f4;
      font-weight: 500;
    }
    .card-header {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 16px;
    }
    .nba-logo {
      width: 28px;
      height: auto;
      flex-shrink: 0;
    }
    @media (max-width: 768px) {
      .container {
        flex-direction: column;
      }
      .scores-section {
        width: 100%;
        max-height: none;
      }
      iframe {
        height: 400px !important;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="videos-section">
      <iframe width="100%" height="600" src="https://www.youtube.com/embed/YoTb4VO7myo" title="YouTube video" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" allowfullscreen></iframe>
      <iframe width="100%" height="600" src="https://www.youtube.com/embed/pEIH1FXXSj0" title="YouTube video" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" allowfullscreen></iframe>
    </div>

    <div class="scores-section">
      <div class="nba-scores-card">
        <div class="card-header">
          <img src="../graphs/nba-logo.svg" alt="NBA" class="nba-logo">
          <div class="live-badge">
            <div class="live-dot"></div>
            LIVE
          </div>
        </div>

        <div class="date-info">
          <span id="date-display">Loading...</span>
        </div>

        <div id="games-container">
          <div style="text-align: center; padding: 20px; color: #999;">Loading scores...</div>
        </div>

        <a href="https://www.espn.com/nba/scores" target="_blank" style="text-decoration: none;">
          <button class="view-schedule-btn">
            View Full Schedule →
          </button>
        </a>
      </div>
    </div>
  </div>

  <script>
    let refreshInterval = null;
    let lastGameStatus = null;

    // NBA Team Logo Mapping - using jsDelivr CDN for React-NBA-Logos
    const teamLogoMap = {
      'ATL': 'ATL',
      'BOS': 'BOS',
      'BRK': 'BRK',
      'CHA': 'CHA',
      'CHI': 'CHI',
      'CLE': 'CLE',
      'DAL': 'DAL',
      'DEN': 'DEN',
      'DET': 'DET',
      'GSW': 'GSW',
      'HOU': 'HOU',
      'LAC': 'LAC',
      'LAL': 'LAL',
      'MEM': 'MEM',
      'MIA': 'MIA',
      'MIL': 'MIL',
      'MIN': 'MIN',
      'NOP': 'NOP',
      'NYK': 'NYK',
      'OKC': 'OKC',
      'ORL': 'ORL',
      'PHI': 'PHI',
      'PHX': 'PHX',
      'POR': 'POR',
      'SAC': 'SAC',
      'SAS': 'SAS',
      'TOR': 'TOR',
      'UTA': 'UTA',
      'WAS': 'WAS'
    };

    // NBA Team Logo URL mapping - Using local SVG files
    const teamCodeMapping = {
      'ATL': 'atl', 'BOS': 'bos', 'BRK': 'bkn', 'CHA': 'cha', 'CHI': 'chi',
      'CLE': 'cle', 'DAL': 'dal', 'DEN': 'den', 'DET': 'det', 'GSW': 'gsw',
      'HOU': 'hou', 'IND': 'ind', 'LAC': 'lac', 'LAL': 'lal', 'MEM': 'mem',
      'MIA': 'mia', 'MIL': 'mil', 'MIN': 'min', 'NOP': 'nop', 'NYK': 'nyk',
      'OKC': 'okc', 'ORL': 'orl', 'PHI': 'phi', 'PHX': 'phx', 'POR': 'por',
      'SAC': 'sac', 'SAS': 'sas', 'TOR': 'tor', 'UTA': 'uta', 'WAS': 'was'
    };

    function getTeamLogoUrl(abbreviation) {
      const teamCode = teamCodeMapping[abbreviation];
      return teamCode ? `../graphs/team-logos/${teamCode}.svg` : null;
    }

    // Enhanced cache system to handle rate limiting
    let scoresCache = {
      data: null,
      lastRequestTime: null,
      minRequestInterval: 30000, // Only allow API request every 30 seconds
      requestInProgress: false,
      consecutiveRateLimits: 0,
      isLoadingDueToRateLimit: false // Track if we're waiting for rate limit recovery
    };

    async function fetchNBAScores() {
      try {
        const container = document.getElementById('games-container');
        const dateDisplay = document.getElementById('date-display');
        
        // Display current date
        const today = new Date();
        const options = { year: 'numeric', month: 'long', day: 'numeric' };
        dateDisplay.textContent = today.toLocaleDateString('en-US', options);
        
        let data = null;
        const now = Date.now();
        const timeSinceLastRequest = scoresCache.lastRequestTime ? (now - scoresCache.lastRequestTime) : Infinity;

        // Prevent concurrent requests
        if (scoresCache.requestInProgress) {
          console.log('Request already in progress, using cached data');
          if (scoresCache.data) {
            data = scoresCache.data;
          } else if (scoresCache.isLoadingDueToRateLimit) {
            // If we're waiting for rate limit recovery, show loading state
            throw new Error('_loading_due_to_rate_limit');
          } else {
            throw new Error('Request in progress, no cache available');
          }
        } 
        // If less than 30 seconds since last API request, use cache instead
        else if (timeSinceLastRequest < scoresCache.minRequestInterval) {
          if (scoresCache.data) {
            console.log(`Using cached data (${timeSinceLastRequest}ms since last request)`);
            data = scoresCache.data;
          } else if (scoresCache.isLoadingDueToRateLimit) {
            // If we're waiting for rate limit recovery, show loading state
            throw new Error('_loading_due_to_rate_limit');
          } else {
            throw new Error('No cached data available, please wait before refreshing');
          }
        } 
        // 30+ seconds passed, fetch fresh data from API
        else {
          console.log('Fetching fresh NBA scores from /api/nba-scores');
          scoresCache.requestInProgress = true;
          
          try {
            const controller = new AbortController();
            // Increase timeout to 30 seconds to handle Vercel cold starts
            const timeoutId = setTimeout(() => {
              console.warn('[NBA API] Request timeout after 30 seconds');
              controller.abort();
            }, 30000);
            
            const response = await fetch('/api/nba-scores', { signal: controller.signal });
            clearTimeout(timeoutId);
            
            const text = await response.text();
            
            console.log('API response status:', response.status, 'Text length:', text.length);
            
            let parsedData;
            try {
              parsedData = JSON.parse(text);
            } catch (parseError) {
              console.error('Failed to parse JSON:', parseError, 'Response text:', text.substring(0, 200));
              throw new Error('API returned invalid JSON');
            }
            
            // Check if we got rate limited
            if (parsedData.rateLimited) {
              console.warn('API returned rate limit signal, waiting for recovery');
              scoresCache.consecutiveRateLimits++;
              scoresCache.isLoadingDueToRateLimit = true;
              
              if (scoresCache.data) {
                data = scoresCache.data;
                console.log(`Using cached data (rate limit #${scoresCache.consecutiveRateLimits})`);
              } else {
                // Don't throw error, just show loading state
                throw new Error('_loading_due_to_rate_limit');
              }
            } else if (parsedData.success === false) {
              console.warn('API returned error');
              
              if (scoresCache.data) {
                data = scoresCache.data;
                console.log('Using cached data due to API error');
              } else {
                throw new Error(parsedData.error || 'API error');
              }
            } else if (parsedData.success === true || response.ok) {
              // Success! Update cache and reset rate limit counter
              data = parsedData;
              scoresCache.data = data;
              scoresCache.consecutiveRateLimits = 0;
              scoresCache.isLoadingDueToRateLimit = false;
              console.log('NBA scores updated successfully');
            } else {
              // Unknown response format, try to use it anyway
              data = parsedData;
              if (parsedData.games) {
                scoresCache.data = data;
                scoresCache.consecutiveRateLimits = 0;
                scoresCache.isLoadingDueToRateLimit = false;
              }
            }
            
          } catch (fetchError) {
            console.error('Fetch error:', fetchError.message, 'Error name:', fetchError.name);
            
            // Better error diagnosis
            let isNetworkError = false;
            let isTimeoutError = false;
            
            if (fetchError.name === 'AbortError') {
              isTimeoutError = true;
              console.error('Request timed out after 30 seconds (Vercel cold start?)');
            } else if (fetchError.message.includes('Network') || fetchError.message.includes('Failed')) {
              isNetworkError = true;
            }
            
            if (scoresCache.data) {
              data = scoresCache.data;
              console.log('Using cached data due to fetch error');
            } else {
              if (isTimeoutError) {
                // Don't show error for timeout, show loading instead
                throw new Error('_loading_due_to_timeout');
              } else if (isNetworkError) {
                throw new Error('Network connection failed');
              } else {
                throw new Error(fetchError.message || 'Load failed');
              }
            }
          } finally {
            scoresCache.requestInProgress = false;
            scoresCache.lastRequestTime = now;
          }
        }
        
        if (!data || !data.games || data.games.length === 0) {
          console.log('No games found');
          container.innerHTML = '<div style="text-align: center; padding: 40px 20px; color: #999; font-size: 14px;">No Games Today</div>';
          setRefreshInterval(1800000);
          return;
        }
        
        // Determine refresh strategy based on game statuses
        const statuses = data.games.map(g => g.status);
        const hasLiveGames = statuses.includes('In Progress');
        const hasScheduledGames = statuses.includes('Scheduled');
        
        // Update refresh interval
        if (hasLiveGames) {
          setRefreshInterval(15000); // 15 seconds for live games
        } else if (hasScheduledGames) {
          setRefreshInterval(300000); // 5 minutes for upcoming games
        } else {
          setRefreshInterval(null); // Stop refreshing when all games are final
        }
        
        renderGames(data.games, container);
      } catch (error) {
        console.error('Error fetching scores:', error);
        
        // If API is rate limited, show loading state
        if (error.message === '_loading_due_to_rate_limit') {
          document.getElementById('games-container').innerHTML = 
            '<div style="text-align: center; padding: 40px 20px; color: #999; font-size: 14px;">Loading scores... Please wait</div>';
          // Retry sooner than error case - every 5 seconds while rate limited
          setRefreshInterval(5000);
          return;
        }
        
        // If timeout (likely Vercel cold start), show loading state and retry sooner
        if (error.message === '_loading_due_to_timeout') {
          document.getElementById('games-container').innerHTML = 
            '<div style="text-align: center; padding: 40px 20px; color: #999; font-size: 14px;">Loading scores... (starting server)</div>';
          // Retry every 5 seconds when timing out
          setRefreshInterval(5000);
          return;
        }
        
        // If no cache available and rate limited, show neutral message
        if (scoresCache.data === null && error.message.includes('rate limit')) {
          document.getElementById('games-container').innerHTML = 
            '<div style="text-align: center; padding: 40px 20px; color: #999; font-size: 14px;">No Games Today</div>';
        } else {
          // Show user-friendly error message
          let errorMsg = error.message;
          let errorType = 'default';
          
          if (errorMsg.includes('rate limit')) {
            errorMsg = 'API temporarily busy - try again in a moment';
            errorType = 'rate-limit';
          } else if (errorMsg.includes('timeout')) {
            errorMsg = 'Server is not responding - please try again';
            errorType = 'timeout';
          } else if (errorMsg.includes('Network')) {
            errorMsg = 'Network connection failed - check your internet';
            errorType = 'network';
          } else if (errorMsg.includes('No cached')) {
            errorMsg = 'Loading data, please refresh in a moment';
            errorType = 'loading';
          } else if (errorMsg.includes('invalid JSON') || errorMsg.includes('Invalid')) {
            errorMsg = 'API returned invalid data - try again';
            errorType = 'parse';
          }
          
          document.getElementById('games-container').innerHTML = 
            '<div style="text-align: center; padding: 20px; color: #d32f2f; font-size: 14px;">Unable to load scores: ' + errorMsg + '</div>';
          
          console.log('Error type detected:', errorType, 'Full error:', error.message);
          
          // Auto-diagnose when error occurs
          console.warn('Auto-running diagnosis due to error...');
          quickDiagnose();
        }
        
        // Try again in 2 minutes on error (unless rate limited or timeout)
        if (error.message !== '_loading_due_to_rate_limit' && error.message !== '_loading_due_to_timeout') {
          setRefreshInterval(120000);
        }
      }
    }

    // Quick diagnostic function to test API connectivity
    async function quickDiagnose() {
      console.log('=== Quick Diagnosis Start ===');
      try {
        console.log('1. Testing API endpoint (timeout: 30 seconds)...');
        const response = await fetch('/api/nba-scores', { signal: AbortSignal.timeout(30000) });
        console.log('   Response status:', response.status);
        console.log('   Response headers:', response.headers);
        
        const text = await response.text();
        console.log('   Response length:', text.length);
        console.log('   Response preview:', text.substring(0, 300));
        
        try {
          const json = JSON.parse(text);
          console.log('   Parsed JSON successfully');
          console.log('   Has games:', Array.isArray(json.games), 'Count:', json.games?.length || 0);
          console.log('   Success flag:', json.success);
          console.log('   Rate limited:', json.rateLimited);
        } catch (e) {
          console.error('   Failed to parse JSON:', e.message);
        }
      } catch (error) {
        console.error('   API Error:', error.message);
        console.error('   Error name:', error.name);
      }
      console.log('=== Quick Diagnosis End ===');
    }

    function renderGames(games, container) {
      let html = '';
      games.forEach(game => {
        const homeTeam = game.home_team;
        const visitorTeam = game.visitor_team;
        const homeScore = game.home_score !== null ? game.home_score : '-';
        const visitorScore = game.visitor_score !== null ? game.visitor_score : '-';
        const status = game.status;
        const homeAbbr = game.home_team_abbreviation;
        const visitorAbbr = game.visitor_team_abbreviation;
        
        // Get logo URLs
        const visitorLogoUrl = getTeamLogoUrl(visitorAbbr);
        const homeLogoUrl = getTeamLogoUrl(homeAbbr);
        const visitorLogoHtml = visitorLogoUrl ? `<img src="${visitorLogoUrl}" alt="${visitorTeam}" class="team-logo" onerror="this.style.display='none'">` : '';
        const homeLogoHtml = homeLogoUrl ? `<img src="${homeLogoUrl}" alt="${homeTeam}" class="team-logo" onerror="this.style.display='none'">` : '';
        
        // Format status display
        let statusDisplay = status;
        if (status === 'Final') statusDisplay = 'Final';
        else if (status === 'In Progress') statusDisplay = 'Live';
        else if (status === 'Scheduled') statusDisplay = 'Scheduled';
        
        html += `
          <div class="game-item">
            <div class="teams-row">
              <div class="team-block">
                ${visitorLogoHtml}
                <div class="team-name">${visitorTeam}</div>
                <div class="team-code">${visitorAbbr}</div>
              </div>
              <div class="score-display">
                <div class="score-numbers">${visitorScore} - ${homeScore}</div>
                <div class="game-status">${statusDisplay}</div>
              </div>
              <div class="team-block">
                ${homeLogoHtml}
                <div class="team-name">${homeTeam}</div>
                <div class="team-code">${homeAbbr}</div>
              </div>
            </div>
          </div>
        `;
      });
      
      container.innerHTML = html;
    }

    function setRefreshInterval(interval) {
      // Auto-refresh temporarily disabled
      // Only manual refresh (cache logic) is active
      // if (refreshInterval) {
      //   clearInterval(refreshInterval);
      //   refreshInterval = null;
      // }
      // if (interval) {
      //   refreshInterval = setInterval(fetchNBAScores, interval);
      // }
    }
    
    // Fetch scores on page load
    console.log('[Basketball Page] Initializing...');
    console.log('[Basketball Page] Running initial diagnostic...');
    quickDiagnose();
    fetchNBAScores();
  </script>
</body>
</html>
