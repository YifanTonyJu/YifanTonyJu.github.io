<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Basketball — Hobbies</title>
  <style>
    * { margin: 0; padding: 0; }
    body { 
      display: flex; 
      align-items: center; 
      justify-content: center; 
      min-height: 100vh; 
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; 
      background: #f5f5f5; 
      padding: 20px; 
    }
    .container { 
      max-width: 1200px; 
      width: 100%; 
      display: flex; 
      gap: 20px; 
    }
    .videos-section { 
      flex: 1; 
      min-width: 0; 
    }
    .scores-section { 
      width: 400px; 
      max-height: 1200px;
      overflow-y: auto;
    }
    iframe { 
      width: 100%; 
      border-radius: 8px; 
    }
    iframe + iframe { 
      margin-top: 16px; 
    }

    /* NBA Scores Card */
    .view-schedule-btn {
      width: 100%;
      padding: 14px;
      margin-top: 16px;
      background: #f8f9fa;
      border: 1px solid #ddd;
      border-radius: 8px;
      color: #4285f4;
      font-size: 15px;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.2s;
    }
    .view-schedule-btn:hover {
      background: #f0f0f0;
    }
    .live-badge {
      background: #e8f5e9;
      color: #2e7d32;
      padding: 6px 12px;
      border-radius: 6px;
      font-size: 12px;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .live-dot {
      width: 8px;
      height: 8px;
      background: #2e7d32;
      border-radius: 50%;
      animation: pulse 2s infinite;
    }
    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.5; }
    }
    .date-info {
      display: flex;
      align-items: center;
      gap: 8px;
      color: #666;
      font-size: 14px;
      margin-bottom: 16px;
      padding-bottom: 16px;
      border-bottom: 1px solid #eee;
    }
    .game-item {
      display: flex;
      flex-direction: column;
      gap: 12px;
      padding: 16px 0;
      border-bottom: 1px solid #eee;
    }
    .game-item:last-of-type {
      border-bottom: none;
    }
    .teams-row {
      display: flex;
      gap: 12px;
      align-items: center;
    }
    .team-block {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
    }
    .team-name {
      font-size: 14px;
      font-weight: 500;
      color: #1a1a1a;
      text-align: center;
    }
    .team-code {
      font-size: 11px;
      color: #999;
    }
    .team-logo {
      width: 45px;
      height: 45px;
      object-fit: contain;
      margin-bottom: 6px;
    }
    .score-display {
      text-align: center;
      display: flex;
      flex-direction: column;
      gap: 4px;
      min-width: 80px;
    }
    .score-numbers {
      font-size: 18px;
      font-weight: 600;
      color: #1a1a1a;
      letter-spacing: 1px;
    }
    .game-status {
      font-size: 12px;
      color: #4285f4;
      font-weight: 500;
    }
    .card-header {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 16px;
    }
    .nba-logo {
      width: 28px;
      height: auto;
      flex-shrink: 0;
    }
    @media (max-width: 768px) {
      .container {
        flex-direction: column;
      }
      .scores-section {
        width: 100%;
        max-height: none;
      }
      iframe {
        height: 400px !important;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="videos-section">
      <iframe width="100%" height="600" src="https://www.youtube.com/embed/YoTb4VO7myo" title="YouTube video" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" allowfullscreen></iframe>
      <iframe width="100%" height="600" src="https://www.youtube.com/embed/pEIH1FXXSj0" title="YouTube video" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" allowfullscreen></iframe>
    </div>

    <div class="scores-section">
      <div class="nba-scores-card">
        <div class="card-header">
          <img src="../graphs/nba-logo.svg" alt="NBA" class="nba-logo">
          <div class="live-badge">
            <div class="live-dot"></div>
            LIVE
          </div>
        </div>

        <div class="date-info">
          <span id="date-display">Loading...</span>
        </div>

        <div id="games-container">
          <div style="text-align: center; padding: 20px; color: #999;">Loading scores...</div>
        </div>

        <a href="https://www.espn.com/nba/scores" target="_blank" style="text-decoration: none;">
          <button class="view-schedule-btn">
            View Full Schedule →
          </button>
        </a>
      </div>
    </div>
  </div>

  <script>
    let refreshInterval = null;
    let lastGameStatus = null;

    // NBA Team Logo Mapping - using jsDelivr CDN for React-NBA-Logos
    const teamLogoMap = {
      'ATL': 'ATL',
      'BOS': 'BOS',
      'BRK': 'BRK',
      'CHA': 'CHA',
      'CHI': 'CHI',
      'CLE': 'CLE',
      'DAL': 'DAL',
      'DEN': 'DEN',
      'DET': 'DET',
      'GSW': 'GSW',
      'HOU': 'HOU',
      'LAC': 'LAC',
      'LAL': 'LAL',
      'MEM': 'MEM',
      'MIA': 'MIA',
      'MIL': 'MIL',
      'MIN': 'MIN',
      'NOP': 'NOP',
      'NYK': 'NYK',
      'OKC': 'OKC',
      'ORL': 'ORL',
      'PHI': 'PHI',
      'PHX': 'PHX',
      'POR': 'POR',
      'SAC': 'SAC',
      'SAS': 'SAS',
      'TOR': 'TOR',
      'UTA': 'UTA',
      'WAS': 'WAS'
    };

    // NBA Team Logo URL mapping - Using local SVG files
    const teamCodeMapping = {
      'ATL': 'atl', 'BOS': 'bos', 'BRK': 'bkn', 'CHA': 'cha', 'CHI': 'chi',
      'CLE': 'cle', 'DAL': 'dal', 'DEN': 'den', 'DET': 'det', 'GSW': 'gsw',
      'HOU': 'hou', 'IND': 'ind', 'LAC': 'lac', 'LAL': 'lal', 'MEM': 'mem',
      'MIA': 'mia', 'MIL': 'mil', 'MIN': 'min', 'NOP': 'nop', 'NYK': 'nyk',
      'OKC': 'okc', 'ORL': 'orl', 'PHI': 'phi', 'PHX': 'phx', 'POR': 'por',
      'SAC': 'sac', 'SAS': 'sas', 'TOR': 'tor', 'UTA': 'uta', 'WAS': 'was'
    };

    function getTeamLogoUrl(abbreviation) {
      const teamCode = teamCodeMapping[abbreviation];
      return teamCode ? `../graphs/team-logos/${teamCode}.svg` : null;
    }

    // Cache for NBA scores to prevent rate limiting (with smart expiration)
    let scoresCache = {
      data: null,
      timestamp: null,
      gameStatus: null // 'In Progress', 'Scheduled', 'Final'
    };

    function getCacheDuration(gameStatus) {
      // Determine cache duration based on game status
      if (gameStatus === 'In Progress') {
        return 15000; // 15 seconds - need fresh data during live games
      } else if (gameStatus === 'Scheduled') {
        return 300000; // 5 minutes - upcoming games don't change often
      } else {
        return 3600000; // 1 hour - final games don't need frequent updates
      }
    }

    function isCacheValid() {
      if (!scoresCache.data || !scoresCache.timestamp || !scoresCache.gameStatus) return false;
      const now = Date.now();
      const cacheDuration = getCacheDuration(scoresCache.gameStatus);
      return (now - scoresCache.timestamp) < cacheDuration;
    }

    async function fetchNBAScores() {
      try {
        const container = document.getElementById('games-container');
        const dateDisplay = document.getElementById('date-display');
        
        // Display current date
        const today = new Date();
        const options = { year: 'numeric', month: 'long', day: 'numeric' };
        dateDisplay.textContent = today.toLocaleDateString('en-US', options);
        
        let data = null;

        // Check cache first
        if (isCacheValid()) {
          console.log('Using cached NBA scores (status: ' + scoresCache.gameStatus + ')');
          data = scoresCache.data;
        } else {
          // Fetch from our Vercel API
          console.log('Fetching fresh NBA scores from /api/nba-scores');
          const response = await fetch('/api/nba-scores');
          
          if (!response.ok) {
            // If API fails but we have cached data, use it as fallback
            if (scoresCache.data) {
              console.warn(`API returned status ${response.status}, using cached data as fallback`);
              data = scoresCache.data;
            } else {
              throw new Error(`API returned status ${response.status}`);
            }
          } else {
            const text = await response.text();
            console.log('API raw response:', text);
            
            try {
              data = JSON.parse(text);
            } catch (parseError) {
              console.error('Failed to parse JSON:', parseError);
              console.error('Response text:', text);
              throw new Error('API returned invalid JSON');
            }
            
            // Determine most critical game status for cache duration
            if (data.games && data.games.length > 0) {
              const statuses = data.games.map(g => g.status);
              const mostCriticalStatus = 
                statuses.includes('In Progress') ? 'In Progress' :
                statuses.includes('Scheduled') ? 'Scheduled' : 'Final';
              
              // Update cache with smart expiration
              scoresCache.data = data;
              scoresCache.timestamp = Date.now();
              scoresCache.gameStatus = mostCriticalStatus;
              console.log('Cached NBA scores with status: ' + mostCriticalStatus);
            }
          }
        }
        
        if (!data || !data.games || data.games.length === 0) {
          console.log('No games found');
          container.innerHTML = '<div style="text-align: center; padding: 40px 20px; color: #999; font-size: 14px;">No Games</div>';
          setRefreshInterval(1800000);
          return;
        }
        
        // Determine refresh strategy based on game statuses
        const statuses = data.games.map(g => g.status);
        const hasLiveGames = statuses.includes('In Progress');
        const hasScheduledGames = statuses.includes('Scheduled');
        const allFinal = statuses.every(s => s === 'Final');
        
        // Update refresh interval
        if (hasLiveGames) {
          setRefreshInterval(15000); // 15 seconds for live games - get fresh data
        } else if (hasScheduledGames) {
          setRefreshInterval(300000); // 5 minutes for upcoming games
        } else if (allFinal) {
          setRefreshInterval(null); // Stop refreshing when all games are final
        }
        
        renderGames(data.games, container);
      } catch (error) {
        console.error('Error fetching scores:', error);
        document.getElementById('games-container').innerHTML = 
          '<div style="text-align: center; padding: 20px; color: #d32f2f; font-size: 14px;">Unable to load scores: ' + error.message + '</div>';
        // Try again in 1 minute on error
        setRefreshInterval(60000);
      }
    }

    function renderGames(games, container) {
      let html = '';
      games.forEach(game => {
        const homeTeam = game.home_team;
        const visitorTeam = game.visitor_team;
        const homeScore = game.home_score !== null ? game.home_score : '-';
        const visitorScore = game.visitor_score !== null ? game.visitor_score : '-';
        const status = game.status;
        const homeAbbr = game.home_team_abbreviation;
        const visitorAbbr = game.visitor_team_abbreviation;
        
        // Get logo URLs
        const visitorLogoUrl = getTeamLogoUrl(visitorAbbr);
        const homeLogoUrl = getTeamLogoUrl(homeAbbr);
        const visitorLogoHtml = visitorLogoUrl ? `<img src="${visitorLogoUrl}" alt="${visitorTeam}" class="team-logo" onerror="this.style.display='none'">` : '';
        const homeLogoHtml = homeLogoUrl ? `<img src="${homeLogoUrl}" alt="${homeTeam}" class="team-logo" onerror="this.style.display='none'">` : '';
        
        // Format status display
        let statusDisplay = status;
        if (status === 'Final') statusDisplay = 'Final';
        else if (status === 'In Progress') statusDisplay = 'Live';
        else if (status === 'Scheduled') statusDisplay = 'Scheduled';
        
        html += `
          <div class="game-item">
            <div class="teams-row">
              <div class="team-block">
                ${visitorLogoHtml}
                <div class="team-name">${visitorTeam}</div>
                <div class="team-code">${visitorAbbr}</div>
              </div>
              <div class="score-display">
                <div class="score-numbers">${visitorScore} - ${homeScore}</div>
                <div class="game-status">${statusDisplay}</div>
              </div>
              <div class="team-block">
                ${homeLogoHtml}
                <div class="team-name">${homeTeam}</div>
                <div class="team-code">${homeAbbr}</div>
              </div>
            </div>
          </div>
        `;
      });
      
      container.innerHTML = html;
    }

    function setRefreshInterval(interval) {
      // Clear existing interval
      if (refreshInterval) {
        clearInterval(refreshInterval);
        refreshInterval = null;
      }
      
      // Set new interval if provided
      if (interval) {
        refreshInterval = setInterval(fetchNBAScores, interval);
      }
    }
    
    // Fetch scores on page load
    fetchNBAScores();
  </script>
</body>
</html>
