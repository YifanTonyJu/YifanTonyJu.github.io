<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Table Tennis Scoreboard</title>
    <style>
        :root {
            --color-bg: #ffffff;
            --color-text: #000000;
            --color-text-muted: #999999;
            --color-gold: #C2A46D;
            --color-border: #e0e0e0;
            --color-light-bg: #fafafa;
            --font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', sans-serif;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: var(--font-family);
            background-color: var(--color-light-bg);
            color: var(--color-text);
        }

        .main-container {
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        .navbar {
            background-color: var(--color-bg);
            border-bottom: 1px solid var(--color-border);
            padding: clamp(0.5rem, 2vw, 1rem) 0;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .navbar-content {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 clamp(1rem, 5vw, 2rem);
            display: flex;
            gap: clamp(1rem, 3vw, 2rem);
            align-items: center;
            justify-content: center;
            flex-wrap: wrap;
        }

        .navbar a {
            text-decoration: none;
            color: var(--color-text);
            font-size: clamp(0.85rem, 2vw, 1rem);
            padding: 0.5rem 0;
            border-bottom: 2px solid transparent;
            transition: all 0.3s ease;
        }

        .navbar a:hover {
            color: var(--color-gold);
        }

        .navbar a.active {
            color: var(--color-gold);
            border-bottom-color: var(--color-gold);
        }

        .content {
            flex: 1;
            max-width: 800px;
            margin: 0 auto;
            padding: clamp(1.5rem, 4vw, 3rem);
            width: 100%;
        }

        h1 {
            text-align: center;
            font-size: clamp(1.5rem, 4vw, 2rem);
            margin-bottom: clamp(1.5rem, 3vw, 2rem);
        }

        .card {
            background-color: var(--color-bg);
            border: 1px solid var(--color-border);
            border-radius: 0.8rem;
            padding: clamp(1.5rem, 3vw, 2rem);
            margin-bottom: clamp(1rem, 2vw, 1.5rem);
        }

        /* Scoreboard Section */
        .scoreboard-grid {
            display: grid;
            grid-template-columns: 1fr auto 1fr;
            gap: clamp(1rem, 2vw, 1.5rem);
            align-items: center;
            margin-bottom: clamp(1.5rem, 2vw, 2rem);
        }

        .player-score {
            text-align: center;
            padding: clamp(1rem, 2vw, 1.5rem);
        }

        .player-controls {
            display: flex;
            gap: clamp(0.5rem, 1vw, 0.75rem);
            justify-content: center;
            margin-top: 0.75rem;
        }

        .player-score.winner {
            background: linear-gradient(135deg, rgba(194, 164, 109, 0.1) 0%, rgba(194, 164, 109, 0.05) 100%);
            border-radius: 0.6rem;
            border: 2px solid var(--color-gold);
        }

        .player-name {
            font-size: clamp(0.85rem, 2vw, 1rem);
            color: var(--color-text-muted);
            margin-bottom: 0.5rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        .score-display {
            font-size: clamp(2.5rem, 8vw, 4rem);
            font-weight: bold;
            color: var(--color-text);
            line-height: 1;
        }

        .vs-separator {
            font-size: clamp(0.85rem, 2vw, 1rem);
            color: var(--color-text-muted);
            font-weight: 500;
            padding: 0 clamp(0.5rem, 1vw, 1rem);
            align-self: center;
        }

        .button-group {
            display: none;
        }

        .btn {
            padding: clamp(0.5rem, 1.5vw, 0.75rem) clamp(1rem, 2vw, 1.5rem);
            font-size: clamp(0.8rem, 1.8vw, 0.95rem);
            border: 1px solid var(--color-border);
            background-color: var(--color-bg);
            color: var(--color-text);
            border-radius: 0.4rem;
            cursor: pointer;
            transition: all 0.2s ease;
            font-family: inherit;
            font-weight: 500;
        }

        .btn:hover {
            background-color: var(--color-gold);
            border-color: var(--color-gold);
            color: var(--color-bg);
        }

        .btn:active {
            transform: scale(0.98);
        }

        .btn.gold {
            background-color: var(--color-gold);
            color: var(--color-bg);
            border-color: var(--color-gold);
        }

        .btn.gold:hover {
            background-color: #b8944a;
            border-color: #b8944a;
        }

        /* Settings Grid */
        .settings-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: clamp(1rem, 2vw, 1.5rem);
            margin-top: clamp(1rem, 2vw, 1.5rem);
        }

        .setting-item {
            text-align: center;
        }

        .setting-label {
            font-size: clamp(0.8rem, 1.8vw, 0.9rem);
            color: var(--color-text-muted);
            margin-bottom: 0.5rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        .slider-container {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            justify-content: center;
        }

        .target-value {
            font-size: clamp(1rem, 2vw, 1.2rem);
            font-weight: bold;
            color: var(--color-text);
            min-width: 3rem;
            text-align: center;
        }

        input[type="range"] {
            width: 100%;
            height: 6px;
            border-radius: 3px;
            background: linear-gradient(to right, #f5f5f5, #e0e0e0);
            outline: none;
            -webkit-appearance: none;
            cursor: pointer;
        }

        input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 18px;
            height: 18px;
            border-radius: 50%;
            background: var(--color-text);
            cursor: pointer;
            transition: all 0.2s ease;
        }

        input[type="range"]::-webkit-slider-thumb:hover {
            transform: scale(1.2);
        }

        input[type="range"]::-moz-range-thumb {
            width: 18px;
            height: 18px;
            border-radius: 50%;
            background: var(--color-text);
            cursor: pointer;
            border: none;
            transition: all 0.2s ease;
        }

        input[type="range"]::-moz-range-thumb:hover {
            transform: scale(1.2);
        }

        /* Toggle Switch */
        .toggle-container {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.75rem;
        }

        .toggle-switch {
            position: relative;
            display: inline-block;
            width: 50px;
            height: 28px;
        }

        .toggle-switch input {
            opacity: 0;
            width: 0;
            height: 0;
        }

        .slider-toggle {
            position: absolute;
            cursor: pointer;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-color: var(--color-border);
            transition: 0.3s;
            border-radius: 34px;
        }

        .slider-toggle:before {
            position: absolute;
            content: "";
            height: 22px;
            width: 22px;
            left: 3px;
            bottom: 3px;
            background-color: var(--color-bg);
            transition: 0.3s;
            border-radius: 50%;
            border: 1px solid var(--color-border);
        }

        input:checked + .slider-toggle {
            background-color: var(--color-gold);
        }

        input:checked + .slider-toggle:before {
            transform: translateX(22px);
            background-color: var(--color-bg);
        }

        .toggle-label {
            font-size: clamp(0.8rem, 1.8vw, 0.9rem);
            color: var(--color-text-muted);
            min-width: 60px;
        }

        /* Action Buttons */
        .action-buttons {
            display: flex;
            gap: clamp(0.5rem, 2vw, 1rem);
            justify-content: center;
            flex-wrap: wrap;
        }

        .action-buttons .btn {
            flex: 1;
            min-width: 120px;
        }

        @media (max-width: 768px) {
            .settings-grid {
                grid-template-columns: 1fr;
            }

            .action-buttons {
                flex-direction: column;
            }

            .action-buttons .btn {
                width: 100%;
            }

            .scoreboard-grid {
                grid-template-columns: 1fr auto 1fr;
                gap: 0.75rem;
            }
        }

        @media (max-width: 480px) {
            .content {
                padding: 1rem;
            }

            .card {
                padding: 1rem;
            }

            .score-display {
                font-size: 2rem;
            }

            .button-group {
                gap: 0.5rem;
            }

            .btn {
                padding: 0.4rem 0.8rem;
                font-size: 0.75rem;
            }
        }

        /* Landscape Mode Optimization */
        @media (orientation: landscape) {
            .main-container {
                display: flex;
                flex-direction: column;
                min-height: 100vh;
            }

            .navbar {
                padding: 0.5rem 0;
            }

            .navbar-content {
                padding: 0 1rem;
                gap: 1rem;
            }

            .navbar a {
                font-size: 0.85rem;
                padding: 0.25rem 0;
            }

            .content {
                padding: clamp(0.75rem, 2vw, 1.5rem);
                flex: 1;
            }

            h1 {
                font-size: 1.5rem;
                margin-bottom: 1rem;
            }

            .card {
                padding: clamp(1rem, 2vw, 1.5rem);
                margin-bottom: 0.75rem;
            }

            .scoreboard-grid {
                grid-template-columns: 1fr auto 1fr;
                gap: 1rem;
                align-items: center;
                margin-bottom: 1rem;
            }

            .player-score {
                padding: 0.75rem;
            }

            .player-name {
                font-size: 0.75rem;
                margin-bottom: 0.25rem;
            }

            .score-display {
                font-size: clamp(2.5rem, 6vw, 3.5rem);
                margin-bottom: 0.5rem;
            }

            .player-controls {
                gap: 0.4rem;
            }

            .btn {
                padding: 0.35rem 0.6rem;
                font-size: 0.7rem;
            }

            .settings-grid {
                grid-template-columns: repeat(3, 1fr);
                gap: 0.75rem;
                margin-top: 0.75rem;
            }

            .setting-item {
                text-align: center;
            }

            .setting-label {
                font-size: 0.7rem;
                margin-bottom: 0.4rem;
            }

            .slider-container {
                gap: 0.5rem;
            }

            .target-value {
                font-size: 1rem;
                min-width: 2.5rem;
            }

            input[type="range"] {
                height: 4px;
            }

            input[type="range"]::-webkit-slider-thumb {
                width: 14px;
                height: 14px;
            }

            input[type="range"]::-moz-range-thumb {
                width: 14px;
                height: 14px;
            }

            .toggle-switch {
                width: 40px;
                height: 22px;
            }

            .slider-toggle:before {
                height: 18px;
                width: 18px;
                left: 2px;
                bottom: 2px;
            }

            input:checked + .slider-toggle:before {
                transform: translateX(18px);
            }

            .toggle-label {
                font-size: 0.7rem;
                min-width: 50px;
            }

            .action-buttons {
                gap: 0.4rem;
                flex-wrap: wrap;
            }

            .action-buttons .btn {
                min-width: 80px;
                flex: 1;
            }
        }

        @media (orientation: landscape) and (max-height: 500px) {
            .navbar {
                padding: 0.3rem 0;
            }

            .navbar-content {
                padding: 0 0.75rem;
                gap: 0.75rem;
            }

            .navbar a {
                font-size: 0.75rem;
            }

            .content {
                padding: 0.5rem;
            }

            h1 {
                font-size: 1.2rem;
                margin-bottom: 0.5rem;
            }

            .card {
                padding: 0.75rem;
            }

            .score-display {
                font-size: 2rem;
                margin-bottom: 0.25rem;
            }

            .player-name {
                font-size: 0.65rem;
            }

            .player-controls {
                gap: 0.3rem;
            }

            .btn {
                padding: 0.3rem 0.5rem;
                font-size: 0.65rem;
            }

            .setting-label {
                font-size: 0.65rem;
            }

            .toggle-label {
                font-size: 0.65rem;
            }
        }
    </style>
</head>
<body>
    <div class="main-container">
        <!-- Navigation Bar -->
        <nav class="navbar">
            <div class="navbar-content">
                <a href="../index.html">Yifan Ju</a>
                <a href="../index.html#projects">Projects</a>
                <a href="../index.html#skills">Skills</a>
                <a href="../index.html#interests">Interests</a>
                <a href="../index.html#hobbies" class="active">Hobbies</a>
                <a href="../index.html#contact">Contact</a>
            </div>
        </nav>

        <!-- Content -->
        <div class="content">
            <h1>🏓 Table Tennis Scoreboard</h1>

            <!-- Scoreboard -->
            <div class="card">
                <div class="scoreboard-grid">
                    <div class="player-score" id="player1-container">
                        <div class="player-name">Player 1</div>
                        <div class="score-display" id="score1">0</div>
                        <div class="player-controls">
                            <button class="btn" onclick="subtractScore(1)">−</button>
                            <button class="btn" onclick="addScore(1)">+</button>
                        </div>
                    </div>
                    <div class="vs-separator">vs</div>
                    <div class="player-score" id="player2-container">
                        <div class="player-name">Player 2</div>
                        <div class="score-display" id="score2">0</div>
                        <div class="player-controls">
                            <button class="btn" onclick="subtractScore(2)">−</button>
                            <button class="btn" onclick="addScore(2)">+</button>
                        </div>
                    </div>
                </div>

                <!-- Settings -->
                <div class="settings-grid">
                    <!-- Target Score -->
                    <div class="setting-item">
                        <div class="setting-label">Target Score</div>
                        <div class="slider-container">
                            <input type="range" id="targetScoreSlider" min="1" max="100" value="11" 
                                   onchange="updateTargetScore(this.value)" 
                                   oninput="updateTargetScore(this.value)">
                        </div>
                        <div class="target-value" id="targetScoreDisplay">11</div>
                    </div>

                    <!-- Deuce Rule Toggle -->
                    <div class="setting-item">
                        <div class="setting-label">Deuce Rule</div>
                        <div class="toggle-container">
                            <label class="toggle-switch">
                                <input type="checkbox" id="deuceToggle" checked onchange="toggleDeuce()">
                                <span class="slider-toggle"></span>
                            </label>
                            <span class="toggle-label" id="deuceLabel">ON</span>
                        </div>
                    </div>

                    <!-- Actions -->
                    <div class="setting-item">
                        <div class="setting-label">Actions</div>
                        <div class="action-buttons">
                            <button class="btn" onclick="resetGame()" style="width: 100%; margin-bottom: 0.5rem;">Reset</button>
                            <button class="btn" onclick="swapSides()" style="width: 100%;">Swap</button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        let score1 = 0;
        let score2 = 0;
        let targetScore = 11;
        let deuceEnabled = true;
        let gameOver = false;

        const score1El = document.getElementById('score1');
        const score2El = document.getElementById('score2');
        const player1Container = document.getElementById('player1-container');
        const player2Container = document.getElementById('player2-container');
        const targetScoreSlider = document.getElementById('targetScoreSlider');
        const targetScoreDisplay = document.getElementById('targetScoreDisplay');
        const deuceToggle = document.getElementById('deuceToggle');
        const deuceLabel = document.getElementById('deuceLabel');

        function addScore(player) {
            if (gameOver) return;
            if (player === 1) score1++;
            else if (player === 2) score2++;
            updateDisplay();
            updateWinner();
        }

        function subtractScore(player) {
            if (player === 1 && score1 > 0) score1--;
            else if (player === 2 && score2 > 0) score2--;
            updateDisplay();
            updateWinner();
        }

        function resetGame() {
            score1 = 0;
            score2 = 0;
            gameOver = false;
            updateDisplay();
        }

        function swapSides() {
            const temp = score1;
            score1 = score2;
            score2 = temp;
            updateDisplay();
            updateWinner();
        }

        function toggleDeuce() {
            deuceEnabled = deuceToggle.checked;
            deuceLabel.textContent = deuceEnabled ? 'ON' : 'OFF';
            updateWinner();
        }

        function updateTargetScore(value) {
            targetScore = parseInt(value);
            targetScoreDisplay.textContent = targetScore;
            updateWinner();
        }

        function updateDisplay() {
            score1El.textContent = score1;
            score2El.textContent = score2;
        }

        function updateWinner() {
            gameOver = false;
            score1El.classList.remove('winner');
            score2El.classList.remove('winner');
            player1Container.classList.remove('winner');
            player2Container.classList.remove('winner');

            // When target score is 1 or less, ignore deuce rule
            if (targetScore <= 1) {
                if (score1 >= targetScore) {
                    gameOver = true;
                    score1El.classList.add('winner');
                    player1Container.classList.add('winner');
                } else if (score2 >= targetScore) {
                    gameOver = true;
                    score2El.classList.add('winner');
                    player2Container.classList.add('winner');
                }
            } else if (deuceEnabled) {
                // Deuce mode: need 2 point lead when reaching target score
                if (score1 >= targetScore && score1 - score2 >= 2) {
                    gameOver = true;
                    score1El.classList.add('winner');
                    player1Container.classList.add('winner');
                } else if (score2 >= targetScore && score2 - score1 >= 2) {
                    gameOver = true;
                    score2El.classList.add('winner');
                    player2Container.classList.add('winner');
                }
            } else {
                // Standard mode: first to target score wins
                if (score1 >= targetScore) {
                    gameOver = true;
                    score1El.classList.add('winner');
                    player1Container.classList.add('winner');
                } else if (score2 >= targetScore) {
                    gameOver = true;
                    score2El.classList.add('winner');
                    player2Container.classList.add('winner');
                }
            }
        }

        // Initialize display
        updateDisplay();
    </script>
</body>
</html>
