<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Cycling — Hobbies</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { 
      display: flex; 
      align-items: center; 
      justify-content: center; 
      min-height: 100vh; 
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; 
      background: #f5f5f5;
      padding: 20px;
    }
    .container {
      display: flex;
      align-items: center;
      gap: 20px;
      flex-wrap: wrap;
      justify-content: center;
    }
    .text {
      font-size: 24px;
      color: #333;
      font-weight: 500;
    }
    .link {
      color: #4CA0D8;
      text-decoration: none;
      font-size: 24px;
      font-weight: 500;
      transition: color 0.3s ease;
    }
    .link:hover {
      color: #2E7CB5;
      text-decoration: underline;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="text">The best bike repair in Scarborough:</div>
    <a href="https://jimmythebikeguy.ca" target="_blank" class="link">Jimmy The Bike Guy</a>
  </div>
</body>
</html>
