<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 214 214" width="100" height="100">
  <defs>
    <style>
      .celtics-green { fill: #007A33; }
      .celtics-white { fill: #FFFFFF; }
      .celtics-black { fill: #000000; }
      .celtics-brown { fill: #8B4513; }
      .celtics-skin { fill: #FDBCB4; }
      .celtics-gold { fill: #FFD700; }
    </style>
  </defs>
  
  <!-- Outer circle background (Celtic Green) -->
  <circle cx="107" cy="107" r="105" class="celtics-green" stroke="#000000" stroke-width="2"/>
  
  <!-- Inner circle white -->
  <circle cx="107" cy="107" r="95" class="celtics-white"/>
  
  <!-- BOSTON text arc path -->
  <path id="topArc" d="M 40 107 A 67 67 0 0 1 174 107" fill="none"/>
  <text class="celtics-black" font-size="28" font-weight="bold" font-family="Arial, sans-serif" letter-spacing="2">
    <textPath href="#topArc" startOffset="50%" text-anchor="middle">
      BOSTON
    </textPath>
  </text>
  
  <!-- CELTICS text arc path (bottom) -->
  <path id="bottomArc" d="M 174 107 A 67 67 0 0 1 40 107" fill="none"/>
  <text class="celtics-black" font-size="28" font-weight="bold" font-family="Arial, sans-serif" letter-spacing="2">
    <textPath href="#bottomArc" startOffset="50%" text-anchor="middle">
      CELTICS
    </textPath>
  </text>
  
  <!-- Leprechaun head circle -->
  <circle cx="107" cy="70" r="16" class="celtics-skin"/>
  
  <!-- Hair/Hat -->
  <ellipse cx="107" cy="58" rx="18" ry="14" class="celtics-brown"/>
  
  <!-- Leprechaun face -->
  <circle cx="102" cy="70" r="3.5" class="celtics-black"/> <!-- Left eye -->
  <circle cx="112" cy="70" r="3.5" class="celtics-black"/> <!-- Right eye -->
  <path d="M 107 73 Q 107 76 105 78" stroke="#000000" stroke-width="1.5" fill="none" stroke-linecap="round"/> <!-- Nose -->
  <path d="M 103 81 Q 107 83 111 81" stroke="#000000" stroke-width="1.5" fill="none" stroke-linecap="round"/> <!-- Mouth -->
  
  <!-- Leprechaun vest/jacket -->
  <rect x="90" y="88" width="34" height="30" rx="4" fill="#2D5016"/>
  
  <!-- Vest pattern (gold dots/clover) -->
  <circle cx="100" cy="97" r="1.8" class="celtics-gold"/>
  <circle cx="107" cy="97" r="1.8" class="celtics-gold"/>
  <circle cx="114" cy="97" r="1.8" class="celtics-gold"/>
  <circle cx="100" cy="106" r="1.8" class="celtics-gold"/>
  <circle cx="107" cy="106" r="1.8" class="celtics-gold"/>
  <circle cx="114" cy="106" r="1.8" class="celtics-gold"/>
  <circle cx="100" cy="115" r="1.8" class="celtics-gold"/>
  <circle cx="107" cy="115" r="1.8" class="celtics-gold"/>
  <circle cx="114" cy="115" r="1.8" class="celtics-gold"/>
  
  <!-- Arms -->
  <ellipse cx="80" cy="103" rx="7" ry="11" fill="#F5DEB3"/> <!-- Left arm -->
  <ellipse cx="134" cy="103" rx="7" ry="11" fill="#F5DEB3"/> <!-- Right arm -->
  
  <!-- Left hand holding basketball -->
  <circle cx="73" cy="92" r="5.5" class="celtics-skin"/>
  <circle cx="66" cy="85" r="13" fill="none" stroke="#FF6600" stroke-width="2.5"/>
  <path d="M 60 79 Q 66 77 72 79" stroke="#FF6600" stroke-width="1.5" fill="none"/>
  <path d="M 56 85 Q 60 85 66 83" stroke="#FF6600" stroke-width="1.5" fill="none"/>
  
  <!-- Right hand -->
  <circle cx="141" cy="103" r="5.5" class="celtics-skin"/>
  
  <!-- Legs -->
  <rect x="100" y="119" width="5" height="18" fill="#2D5016"/>
  <rect x="109" y="119" width="5" height="18" fill="#2D5016"/>
  
  <!-- Shoes -->
  <ellipse cx="102.5" cy="140" rx="7" ry="5" class="celtics-black"/>
  <ellipse cx="111.5" cy="140" rx="7" ry="5" class="celtics-black"/>
  
  <!-- Decorative clover leaves in corners -->
  <g class="celtics-gold" opacity="0.7">
    <!-- Top left clover -->
    <circle cx="25" cy="25" r="2.5"/>
    <circle cx="30" cy="21" r="2.5"/>
    <circle cx="35" cy="25" r="2.5"/>
    <circle cx="30" cy="30" r="2.5"/>
    
    <!-- Top right clover -->
    <circle cx="189" cy="25" r="2.5"/>
    <circle cx="184" cy="21" r="2.5"/>
    <circle cx="179" cy="25" r="2.5"/>
    <circle cx="184" cy="30" r="2.5"/>
    
    <!-- Bottom right clover -->
    <circle cx="189" cy="189" r="2.5"/>
    <circle cx="184" cy="193" r="2.5"/>
    <circle cx="179" cy="189" r="2.5"/>
    <circle cx="184" cy="184" r="2.5"/>
    
    <!-- Bottom left clover -->
    <circle cx="25" cy="189" r="2.5"/>
    <circle cx="30" cy="193" r="2.5"/>
    <circle cx="35" cy="189" r="2.5"/>
    <circle cx="30" cy="184" r="2.5"/>
  </g>
</svg>
